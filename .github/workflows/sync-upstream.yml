name: Sync main from ensdomains/contracts-v2

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Hard-reset main to upstream/main even if the fork has diverged'
        type: boolean
        default: false

permissions:
  contents: write

concurrency: sync-upstream

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the control branch
        uses: actions/checkout@v4
        with:
          ref: steg
          fetch-depth: 1

      - name: Mirror upstream main and tags
        env:
          FORCE: ${{ inputs.force }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/ensdomains/contracts-v2.git
          git fetch --no-tags upstream main
          git fetch upstream --tags
          git fetch origin main || true
          before=$(git rev-parse --verify -q origin/main || echo none)
          after=$(git rev-parse upstream/main)

          if [ -n "$SYNC_TOKEN" ]; then
            # A fine-grained PAT with Contents and Workflows write: full-fidelity git mirror.
            git remote set-url origin "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if [ "$before" = "$after" ]; then echo "main already at $after"
            elif [ "${FORCE:-false}" = "true" ]; then git push --force origin upstream/main:refs/heads/main
            else git push origin upstream/main:refs/heads/main; fi
            git push origin --tags
          else
            # Default token: GitHub's own fork sync for main. It cannot push commits that add or
            # change workflow files, so only tags reachable from main are copied.
            if [ "${FORCE:-false}" = "true" ]; then gh repo sync "$GITHUB_REPOSITORY" --branch main --force
            else gh repo sync "$GITHUB_REPOSITORY" --branch main; fi
            tags=$(git tag --merged upstream/main)
            if [ -n "$tags" ]; then
              git push origin $(for t in $tags; do printf 'refs/tags/%s:refs/tags/%s ' "$t" "$t"; done)
            fi
          fi
          echo "main: $before -> $after"
